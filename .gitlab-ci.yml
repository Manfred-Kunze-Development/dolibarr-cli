include:
  - project: 'veith.dev/devops/gitlab-pipelines'
    ref: v3.4.0
    file:
      - 'common/ChildPipeline.gitlab-ci.yml'

# TODO REMOVE WHEN SUBSCRIPTION IS ACTIVATED
default:
  tags:
    - docker

stages:
  - test
  - contract
  - build
  - deploy

variables:
  # Matches the key seeded by docker/init/ in compose.yml. Dev-only.
  DOLIBARR_API_KEY: dolibarrclidevkey000000000000000

# Unit tests are version-independent: they run against the two committed API
# description fixtures, so there is nothing to gain from a matrix here.
test:unit:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm run typecheck
    - npm run test:unit
  rules:
    - when: always

# Contract tests need a real Dolibarr, so they bring the compose stack up via
# docker-in-docker. This is the job that enforces the three-major support window
# (previous / current / next) — see the Version Support Policy in CLAUDE.md.
#
# Kept off the default path because a cold Dolibarr takes ~2 minutes to become
# healthy per version, and `next` tracks a moving beta that can break through no
# fault of ours.
.contract-template: &contract
  stage: contract
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache nodejs npm
    - npm ci
  script:
    - docker compose --profile $DOLI_PROFILE up -d
    # compose.yml's healthcheck probes the API with the seeded key, so "healthy"
    # means the API genuinely authenticates — not merely that Apache is up.
    - |
      for i in $(seq 1 60); do
        status=$(docker inspect --format='{{.State.Health.Status}}' dolibarr-cli-dev-dolibarr-$DOLI_PROFILE-1 2>/dev/null || echo starting)
        echo "[$i] $DOLI_PROFILE health=$status"
        [ "$status" = "healthy" ] && break
        [ "$status" = "unhealthy" ] && exit 1
        sleep 10
      done
    # A skipped suite exits 0, so assert tests actually ran. Without this the
    # health loop timing out silently turned the whole matrix green.
    - npm run test:contract 2>&1 | tee contract.log
    - grep -qE "Tests +[0-9]+ passed" contract.log || (echo "Contract tests did not run" && exit 1)
    - grep -q "skipped" contract.log && (echo "Contract tests were skipped" && exit 1) || true
  after_script:
    - docker compose --profile $DOLI_PROFILE down -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $RUN_CONTRACT_TESTS == "true"
    - when: manual
      allow_failure: true

contract:previous:
  <<: *contract
  variables:
    DOLI_PROFILE: previous
    DOLIBARR_BASE_URL: http://docker:8022/api/index.php

contract:current:
  <<: *contract
  variables:
    DOLI_PROFILE: current
    DOLIBARR_BASE_URL: http://docker:8023/api/index.php

contract:next:
  <<: *contract
  variables:
    DOLI_PROFILE: next
    DOLIBARR_BASE_URL: http://docker:8024/api/index.php
  # `next` is a moving beta; a failure here is a signal, not a broken build.
  allow_failure: true

build:npm:
  stage: build
  image: node:22-alpine
  script:
    - npm ci
    - npm run build
    # The CLI must start with no config and no manifest — a fresh install shows
    # static commands only, and must not crash looking for a manifest.
    - node dist/cli.js --help
    - node dist/cli.js --version
  artifacts:
    paths:
      - dist/
  rules:
    - when: always

publish:gitlab:
  stage: deploy
  image: node:22-alpine
  needs:
    - build:npm
  script:
    - npm version "${VERSION}" --no-git-tag-version --allow-same-version
    - |
      {
        echo "@${CI_PROJECT_ROOT_NAMESPACE}:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "${CI_API_V4_URL#http*:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=\${CI_JOB_TOKEN}"
      } > .npmrc
    - echo "Publishing ${VERSION} to GitLab npm registry"
    - NPM_PACKAGE_NAME=$(node -p "require('./package.json').name")
    - NPM_PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - |
      if [[ "$(npm view ${NPM_PACKAGE_NAME} versions 2>/dev/null)" != *"'${NPM_PACKAGE_VERSION}'"* ]]; then
        npm publish
        echo "Successfully published ${NPM_PACKAGE_NAME}@${NPM_PACKAGE_VERSION}"
      else
        echo "Version ${NPM_PACKAGE_VERSION} already published, skipping."
      fi
  rules:
    - if: $IS_RELEASE == "true"

publish:npmjs:
  stage: deploy
  image: node:22-alpine
  needs:
    - build:npm
  script:
    - npm version "${VERSION}" --no-git-tag-version --allow-same-version
    - echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
    - NPM_PACKAGE_NAME=$(node -p "require('./package.json').name")
    - NPM_PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - |
      EXISTING=$(npm view "${NPM_PACKAGE_NAME}@${NPM_PACKAGE_VERSION}" version --registry https://registry.npmjs.org 2>/dev/null || true)
      if [ -n "${EXISTING}" ]; then
        echo "Version ${NPM_PACKAGE_VERSION} already published to npmjs.org, skipping."
      elif echo "${NPM_PACKAGE_VERSION}" | grep -q '-'; then
        NPM_TAG=$(echo "${NPM_PACKAGE_VERSION}" | sed 's/.*-\([a-zA-Z]*\).*/\1/')
        echo "Publishing ${NPM_PACKAGE_NAME}@${NPM_PACKAGE_VERSION} to npmjs.org with tag ${NPM_TAG}"
        npm publish --access public --tag "${NPM_TAG}"
      else
        echo "Publishing ${NPM_PACKAGE_NAME}@${NPM_PACKAGE_VERSION} to npmjs.org"
        npm publish --access public
      fi
  rules:
    - if: $IS_RELEASE == "true"
